name: Bug report
description: Report something in goblox that isn't working as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of goblox that was used.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [opencloud, legacy]
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code sample to reproduce the issue.
      render: go
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The error message or response body, if any.
      render: text